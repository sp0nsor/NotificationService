networks:
  notifications-dev:
    driver: bridge

services:
  notificationservice.api:
    container_name: notifications-service
    build:
      context: .
      dockerfile: NotificationService.Api/Dockerfile
    ports:
      - "5000:8080"
    networks:
      - notifications-dev
    depends_on:
      - mongo.db
      - rabbit.mq
  mongo.db:
    container_name: mongodb
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - notifications-dev
    volumes:
      - "mongo-data:/data/db"
  rabbit.mq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - notifications-dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
volumes:
  mongo-data:
  rabbitmq-data:
